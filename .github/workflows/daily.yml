name: Daily Heatmap Data

on:
  schedule:
    - cron: "15 0 * * *"  # UTC 00:15 = MYT 08:15
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Build data.json
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
        run: python scripts/build_data.py
      - name: Commit & push
        run: |
          git config user.name "ZHANGJIGNYA"
          git config user.email "zjy0824113@gmail.com"
          git add public/data.json
          git commit -m "update data.json" || echo "no changes"
          git push