<!doctype html>
<html lang="zh">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vocab Heatmap</title>
    <style>
         :root {
            --zero: rgba(255, 255, 255, 0.06);
            --cell: 14px;
            --gap: 4px;
            --radius: 3px;
            --bg: #0f0f12;
            --text: #eaeaf0;
            --muted: #a7a7b3;
            /* add */
            --add0: var(--zero);
            --add1: #7a4b1f;
            --add2: #ff9f43;
            --add3: #ff7a00;
            /* rev */
            --rev0: var(--zero);
            --rev1: #2f6b45;
            --rev2: #5dd39e;
            --rev3: #1f9d63;
            /* quiz */
            --quiz0: var(--zero);
            --quiz1: #2b4f73;
            --quiz2: #5aa9e6;
            --quiz3: #1d7dd6;
        }
        
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei";
        }
        
        .wrap {
            padding: 18px 16px 22px;
            max-width: 980px;
            margin: 0 auto;
        }
        
        .title {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 12px;
        }
        
        .title h1 {
            font-size: 18px;
            margin: 0;
        }
        
        .title .hint {
            font-size: 12px;
            color: var(--muted);
        }
        /* 主体布局：左边月份标签 + 网格 */
        
        .heatmap {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 10px;
            align-items: start;
        }
        
        .months {
            display: flex;
            flex-direction: column;
            gap: 0;
            padding-top: 2px;
        }
        
        .month {
            height: calc(var(--cell) + var(--gap));
            font-size: 11px;
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 6px;
            user-select: none;
            white-space: nowrap;
        }
        
        .grid {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: calc(var(--cell) + var(--gap));
            grid-template-rows: repeat(7, calc(var(--cell) + var(--gap)));
            gap: 0;
            padding-bottom: 6px;
        }
        
        .col-sep {
            position: relative;
        }
        
        .col-sep::before {
            content: "";
            position: absolute;
            left: -2px;
            top: 0;
            width: 1px;
            height: 100%;
            background: rgba(255, 255, 255, 0.10);
        }
        
        .cell {
            width: var(--cell);
            height: var(--cell);
            border-radius: var(--radius);
            display: flex;
            overflow: hidden;
            outline: 1px solid rgba(255, 255, 255, 0.06);
        }
        
        .seg {
            background: var(--zero);
            flex: 1 1 0;
            height: 100%;
        }
        /* Map classes -> colors */
        
        .add1 {
            background: var(--add1) !important;
        }
        
        .add2 {
            background: var(--add2) !important;
        }
        
        .add3 {
            background: var(--add3) !important;
        }
        
        .rev1 {
            background: var(--rev1) !important;
        }
        
        .rev2 {
            background: var(--rev2) !important;
        }
        
        .rev3 {
            background: var(--rev3) !important;
        }
        
        .quiz1 {
            background: var(--quiz1) !important;
        }
        
        .quiz2 {
            background: var(--quiz2) !important;
        }
        
        .quiz3 {
            background: var(--quiz3) !important;
        }
        
        .legend {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            color: var(--muted);
            font-size: 12px;
        }
        
        .legend-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .legend-label {
            width: 64px;
            text-align: left;
            color: var(--text);
        }
        
        .legend-note {
            margin-left: 4px;
            color: var(--muted);
            white-space: nowrap;
            /* “Low → High” 不换行把布局搞乱 */
        }
        
        .chip {
            width: 10px;
            height: 10px;
            border-radius: 2px;
            outline: 1px solid rgba(255, 255, 255, 0.08);
            background: var(--zero);
        }
        
        .pill {
            display: inline-flex;
            gap: 6px;
            align-items: center;
            padding: 4px 8px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text);
            font-size: 12px;
        }
        
        .tooltip {
            position: fixed;
            pointer-events: none;
            background: rgba(20, 20, 26, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text);
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 12px;
            transform: translate(-50%, -120%);
            opacity: 0;
            transition: opacity .12s ease;
            white-space: nowrap;
            z-index: 9999;
        }
        
        .tooltip small {
            color: var(--muted);
            display: block;
            margin-top: 2px;
        }
        
        .grid-wrap {
            display: inline-block;
            overflow-x: auto;
            /* ✅ 统一在外层滚动 */
            padding-bottom: 6px;
        }
        
        .months-top {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: calc(var(--cell) + var(--gap));
            gap: 0;
            margin-bottom: 6px;
            user-select: none;
            position: sticky;
            /* 可选：滚动时保持在上方 */
            top: 0;
            background: var(--bg);
            /* 避免遮挡时透底 */
            z-index: 5;
        }
        
        .month-label {
            font-size: 11px;
            color: var(--muted);
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="title">
            <h1>Vocabulary Heatmap</h1>
            <div class="hint">每格 3 段：add / review / quiz</div>
        </div>

        <div class="heatmap">
            <div class="months" id="months"></div>
            <div class="grid-wrap" id="gridWrap">
                <div class="months-top" id="monthsTop"></div>
                <div class="grid" id="grid"></div>
            </div>
        </div>

        <div class="legend">
            <span class="pill">Top = New · Middle = Review · Bottom = Quiz</span>
            <div class="legend-row">
                <span class="legend-label">New</span>
                <span class="chip add1"></span>
                <span class="chip add2"></span>
                <span class="chip add3"></span>
                <span class="legend-note">Low → High</span>
            </div>

            <div class="legend-row">
                <span class="legend-label">Review</span>
                <span class="chip rev1"></span>
                <span class="chip rev2"></span>
                <span class="chip rev3"></span>
                <span class="legend-note">Low → High</span>
            </div>

            <div class="legend-row">
                <span class="legend-label">Quiz</span>
                <span class="chip quiz1"></span>
                <span class="chip quiz2"></span>
                <span class="chip quiz3"></span>
                <span class="legend-note">Low → High</span>
            </div>
        </div>
    </div>

    <div class="tooltip" id="tip"></div>

    <script>
        const DAYS = 180;

        async function boot() {
            // 1) 先拿数据
            // const res = await fetch(`/.netlify/functions/getHeatmap?days=${DAYS}`);
            const res = await fetch(`./data.json?ts=${Date.now()}`);
            // if (!res.ok) {
            //     const t = await res.text();
            //     console.log("getHeatmap failed:", res.status, t);
            //     return;
            // }
            // const data = await res.json();

            if (!res.ok) {
                const t = await res.text();
                console.log("data.json fetch failed:", res.status, t);
                return;
            }
            const data = await res.json();
            
            
            // 2) 再开始你原本的渲染逻辑
            const pad = n => String(n).padStart(2, "0");
            const toISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

            const map = new Map(data.map(x => [x.date, x])); // ✅ data 现在存在了

            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const start = new Date(today);
            start.setDate(start.getDate() - (DAYS - 1));

            const startDay = start.getDay();
            const mondayIndex = (startDay + 6) % 7;
            start.setDate(start.getDate() - mondayIndex);

            const monthsEl = document.getElementById("months");
            const gridEl = document.getElementById("grid");
            const tip = document.getElementById("tip");
            const monthsTopEl = document.getElementById("monthsTop");

            function addClass(n) {
                n = Number(n) || 0;
                if (n >= 3) return "add3";
                if (n === 2) return "add2";
                if (n === 1) return "add1";
                return "";
            }

            function revClass(n) {
                n = Number(n) || 0;
                if (n >= 3) return "rev3";
                if (n === 2) return "rev2";
                if (n === 1) return "rev1";
                return "";
            }

            function quizClass(n) {
                n = Number(n) || 0;
                if (n >= 3) return "quiz3";
                if (n === 2) return "quiz2";
                if (n === 1) return "quiz1";
                return "";
            }

            function monthLabel(m) {
                return `${m + 1}`;
            }

            const end = new Date(today);
            end.setDate(end.getDate() + (7 - ((end.getDay() + 6) % 7) - 1));

            const totalDays = Math.round((end - start) / (1000 * 60 * 60 * 24)) + 1;
            const cols = Math.ceil(totalDays / 7);

            // left placeholder
            monthsEl.innerHTML = `
      <div class="month"> </div><div class="month"> </div><div class="month"> </div>
      <div class="month"> </div><div class="month"> </div><div class="month"> </div>
      <div class="month"> </div>
    `;

            // top month row
            const monthLabelsTop = [];
            for (let c = 0; c < cols; c++) {
                const weekStart = new Date(start);
                weekStart.setDate(start.getDate() + c * 7);

                let label = "";
                for (let i = 0; i < 7; i++) {
                    const d = new Date(weekStart);
                    d.setDate(weekStart.getDate() + i);
                    if (d.getDate() === 1) {
                        label = monthLabel(d.getMonth());
                        break;
                    }
                }
                monthLabelsTop.push(label);
            }

            monthsTopEl.innerHTML = "";
            monthLabelsTop.forEach((t) => {
                const div = document.createElement("div");
                div.className = "month-label";
                div.textContent = t;
                monthsTopEl.appendChild(div);
            });

            // render grid
            gridEl.innerHTML = "";
            gridEl.style.gridTemplateRows = `repeat(7, calc(var(--cell) + var(--gap)))`;

            let cursor = new Date(start);
            for (let dayIndex = 0; dayIndex < totalDays; dayIndex++) {
                const iso = toISO(cursor);
                const val = map.get(iso) || {
                    add: 0,
                    review: 0,
                    quiz: 0
                };

                const cell = document.createElement("div");
                cell.className = "cell";

                const s1 = document.createElement("div");
                s1.className = `seg ${addClass(val.add)}`;

                const s2 = document.createElement("div");
                s2.className = `seg ${revClass(val.review)}`;

                const s3 = document.createElement("div");
                s3.className = `seg ${quizClass(val.quiz)}`;

                cell.appendChild(s1);
                cell.appendChild(s2);
                cell.appendChild(s3);

                cell.addEventListener("mousemove", (e) => {
                    tip.style.left = e.clientX + "px";
                    tip.style.top = e.clientY + "px";
                    tip.style.opacity = "1";
                    tip.innerHTML = `<b>${iso}</b><small>New: ${val.add} · Review: ${val.review} · Quiz: ${val.quiz}</small>`;
                });
                cell.addEventListener("mouseleave", () => tip.style.opacity = "0");

                gridEl.appendChild(cell);
                cursor.setDate(cursor.getDate() + 1);
            }
        }

        boot().catch(err => {
            console.log("boot error:", err);
        });
    </script>
</body>

</html>
